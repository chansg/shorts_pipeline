<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="1280" height="660" fill="#0D1421"/>

  <!-- ============ stage labels ============ -->
  <g font-size="13" font-weight="bold" fill="#64748B" letter-spacing="2.5">
    <text x="30"   y="42">INGEST</text>
    <text x="250"  y="42">EXTRACT</text>
    <text x="580"  y="42">SCORE</text>
    <text x="800"  y="42">TRANSFORM</text>
    <text x="1040" y="42">OUTPUT</text>
  </g>

  <!-- ============ INGEST ============ -->
  <rect x="30" y="185" width="170" height="165" rx="8" fill="#18243A" stroke="#0E7490" stroke-width="1.5"/>
  <text x="115" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Long recording</text>
  <line x1="55" y1="240" x2="175" y2="240" stroke="#243449" stroke-width="1"/>
  <text x="115" y="266" text-anchor="middle" font-size="12" fill="#94A3B8">Track 1</text>
  <text x="115" y="284" text-anchor="middle" font-size="12" fill="#E2E8F0">game mix</text>
  <text x="115" y="312" text-anchor="middle" font-size="12" fill="#94A3B8">Track 2</text>
  <text x="115" y="330" text-anchor="middle" font-size="12" fill="#4ADE80">isolated voice</text>

  <!-- fan-out arrows -->
  <path d="M 205 267 C 228 267 228 140 246 140" stroke="#22D3EE" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 205 267 L 246 267"                 stroke="#22D3EE" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 205 267 C 228 267 228 394 246 394" stroke="#22D3EE" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ EXTRACT — three signals ============ -->

  <!-- 1. audio reaction -->
  <rect x="250" y="88" width="300" height="105" rx="8" fill="#18243A" stroke="#22D3EE" stroke-width="2"/>
  <text x="270" y="116" font-size="15" font-weight="bold" fill="#22D3EE">Audio reaction</text>
  <text x="530" y="116" text-anchor="end" font-size="10" font-weight="bold" fill="#4ADE80" letter-spacing="1">PRIMARY</text>
  <text x="270" y="140" font-size="11.5" fill="#94A3B8">300–3400 Hz band-pass, windowed RMS</text>
  <text x="270" y="159" font-size="11.5" fill="#94A3B8">onset vs. rolling baseline</text>
  <text x="270" y="180" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#4ADE80">streamed — O(windows), memory-flat</text>

  <!-- 2. HUD OCR -->
  <rect x="250" y="215" width="300" height="105" rx="8" fill="#18243A" stroke="#FBBF24" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="270" y="243" font-size="15" font-weight="bold" fill="#FBBF24">HUD OCR</text>
  <text x="530" y="243" text-anchor="end" font-size="10" font-weight="bold" fill="#FBBF24" letter-spacing="1">BOOSTER</text>
  <text x="270" y="267" font-size="11.5" fill="#94A3B8">Tesseract, sampled inside candidate</text>
  <text x="270" y="286" font-size="11.5" fill="#94A3B8">windows only</text>
  <text x="270" y="307" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#FBBF24">allowed to fail — run survives</text>

  <!-- 3. ASR -->
  <rect x="250" y="342" width="300" height="105" rx="8" fill="#18243A" stroke="#22D3EE" stroke-width="2"/>
  <text x="270" y="370" font-size="15" font-weight="bold" fill="#22D3EE">Speech-to-text</text>
  <text x="530" y="370" text-anchor="end" font-size="10" font-weight="bold" fill="#94A3B8" letter-spacing="1">WhisperX</text>
  <text x="270" y="394" font-size="11.5" fill="#94A3B8">word-level timestamps + alignment</text>
  <text x="270" y="413" font-size="11.5" fill="#94A3B8">speaker diarization (pyannote)</text>
  <text x="270" y="434" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#4ADE80">runs on the clean voice track</text>

  <!-- converge arrows -->
  <path d="M 554 140 C 572 140 572 267 588 267" stroke="#22D3EE" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 554 267 L 588 267"                 stroke="#22D3EE" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <path d="M 554 394 C 572 394 572 267 588 267" stroke="#22D3EE" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ SCORE ============ -->
  <rect x="592" y="185" width="185" height="165" rx="8" fill="#18243A" stroke="#22D3EE" stroke-width="2"/>
  <text x="684" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Weighted fusion</text>
  <line x1="617" y1="240" x2="752" y2="240" stroke="#243449" stroke-width="1"/>
  <text x="684" y="270" text-anchor="middle" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#4ADE80">audio × (1 + hud)</text>
  <text x="684" y="300" text-anchor="middle" font-size="12" fill="#94A3B8">dedupe · rank · cap</text>
  <text x="684" y="326" text-anchor="middle" font-size="12" fill="#94A3B8">top-N windows</text>

  <path d="M 781 267 L 812 267" stroke="#22D3EE" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ TRANSFORM ============ -->
  <rect x="816" y="185" width="200" height="165" rx="8" fill="#18243A" stroke="#0E7490" stroke-width="1.5"/>
  <text x="916" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Transform</text>
  <line x1="841" y1="240" x2="991" y2="240" stroke="#243449" stroke-width="1"/>
  <text x="916" y="266" text-anchor="middle" font-size="12" fill="#E2E8F0">cut · reframe 9:16</text>
  <text x="916" y="292" text-anchor="middle" font-size="12" fill="#E2E8F0">caption · censor</text>
  <text x="916" y="318" text-anchor="middle" font-size="12" fill="#E2E8F0">effects · overlay</text>
  <text x="916" y="341" text-anchor="middle" font-size="11" fill="#64748B">near-lossless intermediates</text>

  <path d="M 1020 267 L 1051 267" stroke="#22D3EE" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- ============ OUTPUT ============ -->
  <rect x="1055" y="185" width="195" height="165" rx="8" fill="#18243A" stroke="#4ADE80" stroke-width="2"/>
  <text x="1152" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#4ADE80">Encode</text>
  <line x1="1080" y1="240" x2="1225" y2="240" stroke="#243449" stroke-width="1"/>
  <text x="1152" y="266" text-anchor="middle" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#E2E8F0">CRF · high · faststart</text>
  <text x="1152" y="292" text-anchor="middle" font-size="12" fill="#94A3B8">one stage governs</text>
  <text x="1152" y="310" text-anchor="middle" font-size="12" fill="#94A3B8">final quality</text>
  <text x="1152" y="338" text-anchor="middle" font-size="12" fill="#FFFFFF">+ run manifest</text>

  <!-- ============ ORCHESTRATION BAND ============ -->
  <rect x="30" y="500" width="1220" height="118" rx="8" fill="#131E33" stroke="#0E7490" stroke-width="1.5"/>

  <text x="55" y="533" font-size="13" font-weight="bold" fill="#22D3EE" letter-spacing="2.5">ORCHESTRATION</text>
  <text x="215" y="533" font-size="12" fill="#64748B">— every stage above runs through this layer</text>

  <g font-size="12.5">
    <text x="55"  y="570" fill="#FFFFFF" font-weight="bold">Resumable stages</text>
    <text x="55"  y="591" fill="#94A3B8">completion derived from disk</text>

    <text x="340" y="570" fill="#FFFFFF" font-weight="bold">Never re-bill</text>
    <text x="340" y="591" fill="#94A3B8">finished API work is skipped</text>

    <text x="620" y="570" fill="#FFFFFF" font-weight="bold">QC gates</text>
    <text x="620" y="591" fill="#94A3B8">spec + bad-frame checks</text>

    <text x="880" y="570" fill="#FFFFFF" font-weight="bold">Manifests</text>
    <text x="880" y="591" fill="#94A3B8">per-run lineage</text>

    <text x="1080" y="570" fill="#FFFFFF" font-weight="bold">Error mapping</text>
    <text x="1080" y="591" fill="#94A3B8">actionable, not tracebacks</text>
  </g>

  <!-- ticks linking band to flow -->
  <g stroke="#243449" stroke-width="1" stroke-dasharray="3 4">
    <line x1="115"  y1="355" x2="115"  y2="500"/>
    <line x1="400"  y1="452" x2="400"  y2="500"/>
    <line x1="684"  y1="355" x2="684"  y2="500"/>
    <line x1="916"  y1="355" x2="916"  y2="500"/>
    <line x1="1152" y1="355" x2="1152" y2="500"/>
  </g>

</svg>
